# The single bridge between icp-net and integration-net.
#
# Layer 4 on purpose: the ICP serves HTTPS with its own self-signed certificate, and a TCP
# proxy neither terminates nor re-signs it — so what the integration sees is exactly what
# the ICP served, and this file cannot accidentally become part of the security story.
#
# Workflow traffic is pinned to one node. The command tunnel keeps its queue, its waiters
# and its results in memory on the node that accepted the console request, so a result
# posted to a *different* node has nobody waiting for it and the caller times out with 504.
# Pinning is what makes the tunnel usable while ICP is clustered; swap in
# nginx.roundrobin.conf to watch it fail, which is the point of that file.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    log_format basic '$remote_addr -> $upstream_addr [$protocol] $status $bytes_sent/$bytes_received $session_time';
    access_log /var/log/nginx/stream.log basic;

    # Runtime listener: heartbeats in, command results back. Single node, deliberately.
    upstream icp_runtime {
        server icp-1:9445;
    }

    # Console. Also single node, for the same reason: a workflow request queues its command
    # on whichever node serves it, and that has to be the node the runtimes report to.
    upstream icp_console {
        server icp-1:9446;
    }

    server {
        listen 9445;
        proxy_pass icp_runtime;
        proxy_connect_timeout 5s;
        # Longer than the tunnel's 25s waiter, so a blocked workflow request is not cut
        # off by the proxy before the ICP answers it.
        proxy_timeout 120s;
    }

    server {
        listen 9446;
        proxy_pass icp_console;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
    }
}
