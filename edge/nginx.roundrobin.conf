# No affinity, by design — the default for the cluster profile.
#
# This config used to exist to REPRODUCE a limitation: with the in-memory tunnel, a console
# request queued its command on one node while the runtime posted the result to the other,
# and roughly half the Workflows requests timed out after ~25s. The cache tables moved that
# queue and those results into the shared database, so the same routing is now the thing
# being verified rather than the thing being demonstrated as broken.
#
# What to expect: every Workflows view answers, and no node is the "right" one. A read is
# accepted by whichever node the request lands on, claimed by whichever node answers the
# next heartbeat, and served from the cache to whichever node the poll lands on.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# Round-robin per REQUEST, by terminating TLS here and re-originating it to the nodes.
#
# The TCP variant (nginx.tcp-roundrobin.conf) balances per CONNECTION, which sounds equivalent
# and is not: both the console in a browser and the bridge's HTTP client keep connections
# alive, so every request on one connection lands on the same node. That is stickiness by
# connection reuse rather than by configuration — the environment claimed to be testing the
# stateless path while pinning each client to a node for the life of its connection.
#
# Balancing per request is the point. It is what makes the node that accepts a console request
# routinely NOT the node that answers the runtime's next heartbeat, which is the case the
# cache tables exist for.
#
# Both certificates are self-signed — the distribution's and this proxy's — so verification is
# off in both directions. That is a property of the test environment, not a suggestion.
http {
    log_format upstream_node '$remote_addr "$request" $status upstream=$upstream_addr '
                             'rt=$request_time';
    access_log /var/log/nginx/access.log upstream_node;

    # No keepalive to the upstreams on purpose: a pooled connection would balance once and
    # then stay put, which is the behaviour this config exists to avoid.
    upstream icp_runtime {
        server icp-1:9445;
        server icp-2:9445;
    }

    upstream icp_console {
        server icp-1:9446;
        server icp-2:9446;
    }

    # A command result carries whatever the operation answered — an instance history runs to
    # hundreds of kilobytes — so the body limit has to be generous. nginx's default would
    # reject exactly the answers that matter most.
    client_max_body_size 32m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_http_version 1.1;

    # The runtime port: heartbeats and command results from the integrations. Each request is
    # balanced independently, so a heartbeat and the result posted after it routinely reach
    # different nodes.
    server {
        listen 9445 ssl;
        ssl_certificate /etc/nginx/certs/edge.crt;
        ssl_certificate_key /etc/nginx/certs/edge.key;

        location / {
            proxy_pass https://icp_runtime;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }
    }

    # The console port.
    server {
        listen 9446 ssl;
        ssl_certificate /etc/nginx/certs/edge.crt;
        ssl_certificate_key /etc/nginx/certs/edge.key;

        location / {
            proxy_pass https://icp_console;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # The console's live runtime updates arrive over a WebSocket, which pins that ONE
            # connection to whichever node accepted it. Note what that does not fix: the
            # broadcaster is per-process, so a client only receives events its own node
            # published — a pre-existing gap this environment makes visible.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
