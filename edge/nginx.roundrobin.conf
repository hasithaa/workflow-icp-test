# Same bridge, no affinity — for reproducing the known single-instance limitation of the
# command tunnel rather than working around it.
#
# Run the cluster profile with EDGE_CONF=nginx.roundrobin.conf and drive the Workflows
# views. Roughly half the requests should answer 504 after ~25s: the console request
# queued its command on one node, and the runtime posted the result to the other, where no
# waiter exists. Definitions keep working throughout — they are served from the database,
# not the tunnel — which is a useful demonstration of where the boundary actually is.
#
# Fix direction (not implemented): move the queue and results to shared state, or route
# workflow traffic by runtime so a runtime's heartbeats, its results, and the console
# requests that target it all land on one node.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    log_format basic '$remote_addr -> $upstream_addr [$protocol] $status $bytes_sent/$bytes_received $session_time';
    access_log /var/log/nginx/stream.log basic;

    upstream icp_runtime {
        # hash $remote_addr would pin each runtime to a node; without it, consecutive
        # heartbeats from the same runtime can land anywhere.
        server icp-1:9445;
        server icp-2:9445;
    }

    upstream icp_console {
        server icp-1:9446;
        server icp-2:9446;
    }

    server {
        listen 9445;
        proxy_pass icp_runtime;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
    }

    server {
        listen 9446;
        proxy_pass icp_console;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
    }
}
